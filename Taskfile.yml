version: "3"

vars:
  IMAGE: '{{.IMAGE | default "saga3:dev"}}'
  STRIMZI_VERSION: '{{.STRIMZI_VERSION | default "1.3.0"}}'
  KEDA_VERSION: '{{.KEDA_VERSION | default "2.21.0"}}'
  RATE: '{{.RATE | default "50"}}'
  DURATION: '{{.DURATION | default "60s"}}'

tasks:
  default:
    desc: list tasks
    silent: true
    cmds:
      - task --list

  # Go
  build:
    desc: build all binaries into ./bin
    cmds:
      - go build -o ./bin/ ./cmd/...

  test:
    desc: unit tests (no Docker needed)
    cmds:
      - go test -count=1 ./...

  test-integration:
    desc: integration + full-flow tests (needs Docker; testcontainers)
    cmds:
      - go test -tags=integration -count=1 -timeout=20m ./test/integration/...

  cover:
    desc: unit test coverage report
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out

  lint:
    desc: golangci-lint, same as CI, shows ALL issues
    cmds:
      - golangci-lint run --max-issues-per-linter=0 --max-same-issues=0 ./...

  fmt:
    desc: format the code and tidy go.mod
    cmds:
      - gofmt -s -w .
      - go mod tidy

  check:
    desc: everything the CI unit job checks except -race, run before every push
    cmds:
      - go build ./...
      - go vet ./...
      - go vet -tags=integration ./test/...
      - task: test
      - task: lint

  # Docker Compose
  up:
    desc: infra + migrations + topics
    cmds:
      - docker compose up -d --build

  up-apps:
    desc: infra + all services
    cmds:
      - docker compose --profile apps up -d --build

  up-pgbouncer:
    desc: all services, API and workers through PgBouncer
    cmds:
      - docker compose -f docker-compose.yml -f docker-compose.pgbouncer.yml --profile apps up -d --build

  down:
    desc: stop everything and drop volumes
    cmds:
      - docker compose --profile apps down -v

  logs:
    desc: follow the logs of all services
    cmds:
      - docker compose --profile apps logs -f --tail=100

  ps:
    desc: show running containers
    cmds:
      - docker compose --profile apps ps

  # Kubernetes (kind)
  kind-up:
    desc: create kind cluster + install Strimzi and KEDA (pinned versions)
    preconditions:
      - sh: command -v sed
        msg: "kind-up needs sed and it is not in PATH: run it from Git Bash"
    cmds:
      - kind create cluster --config deploy/k8s/apps/overlays/kind/kind-cluster.yaml --wait 180s
      - kubectl create namespace saga
      - >-
        curl -sL https://github.com/strimzi/strimzi-kafka-operator/releases/download/{{.STRIMZI_VERSION}}/strimzi-cluster-operator-{{.STRIMZI_VERSION}}.yaml
        | sed 's/namespace: myproject/namespace: saga/g'
        | kubectl apply --server-side -n saga -f -
      - kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v{{.KEDA_VERSION}}/keda-{{.KEDA_VERSION}}.yaml
      - kubectl -n saga rollout status deployment/strimzi-cluster-operator --timeout=300s
      - kubectl -n keda rollout status deployment/keda-operator --timeout=300s

  kind-load:
    desc: build the image and load it into kind
    cmds:
      - docker build -t {{.IMAGE}} .
      - kind load docker-image {{.IMAGE}} --name saga3

  k8s-infra:
    desc: postgres, kafka (Strimzi), otel, jaeger
    cmds:
      - kubectl apply -k deploy/k8s/infra
      - kubectl -n saga wait kafka/saga-kafka --for=condition=Ready --timeout=900s

  k8s-apps:
    desc: jobs + services (+ KEDA lag autoscaling)
    cmds:
      - kubectl apply -k deploy/k8s/apps/overlays/kind
      - kubectl apply -n saga -f deploy/k8s/keda/scaledobjects.yaml

  k8s-down:
    desc: delete the kind cluster
    cmds:
      - kind delete cluster --name saga3

  # Load test
  load:
    desc: k6 against the compose API (RATE orders/s for DURATION)
    cmds:
      - >-
        docker run --rm -i -e BASE_URL=http://host.docker.internal:8080 -e RATE={{.RATE}} -e DURATION={{.DURATION}}
        -e SEAT_OFFSET={{mul (add (randInt 0 80) 1) 1000}} grafana/k6:2.3.0 run - < test/load/orders.js
