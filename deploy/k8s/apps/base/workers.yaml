apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker
  labels: { app.kubernetes.io/name: payment-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: payment-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payment-worker }
    spec:
      containers:
        - name: app
          image: saga3
          command: [payment-worker]
          ports: []
          env:
            - { name: SERVICE_NAME, value: payment-worker }
            - { name: CONSUMER_GROUP, value: payment }
            - { name: CONSUMER_TOPICS, value: payment.commands }
            - { name: PAYMENT_LIMIT_CENTS, value: "100000" }
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: saga-db, key: PAYMENT_DSN } }
          resources:
