apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saga

labels:
  - pairs:
      app.kubernetes.io/part-of: saga3
    includeTemplates: true

resources:
  - jobs.yaml
  - orchestrator-api.yaml
  - workers.yaml
  - outbox-relays.yaml
  - pdb.yaml

configMapGenerator:
  - name: saga-config
    literals:
      - APP_ENV=k8s
      - LOG_LEVEL=info
      - KAFKA_BROKERS=saga-kafka-kafka-bootstrap:9092
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - SHUTDOWN_TIMEOUT=25s
      - TOPIC_PARTITIONS=12
      - TOPIC_REPLICATION_FACTOR=3


patches:
  - path: patches/pod-defaults.yaml
    target:
      kind: Deployment

images:
  - name: saga3
    newName: saga3
    newTag: dev
