# Optional: autoscale workers on Kafka consumer lag (requires KEDA installed).
#   kubectl apply -n saga -f deploy/k8s/keda/scaledobjects.yaml
# KEDA creates/owns an HPA per worker. maxReplicaCount = partitions (12):
# beyond that, extra consumers get no partitions.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inventory-worker
spec:
  scaleTargetRef: { name: inventory-worker }
  minReplicaCount: 2
  maxReplicaCount: 12
  cooldownPeriod: 120
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: saga-kafka-kafka-bootstrap:9092
        consumerGroup: inventory
        topic: inventory.commands
        lagThreshold: "200" # target lag per replica
        offsetResetPolicy: earliest
---
