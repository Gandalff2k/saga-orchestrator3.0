# Metrics arrive via remote-write from the otel-collector (push), so there is
# nothing app-side to scrape. Prometheus only scrapes itself and evaluates rules.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
