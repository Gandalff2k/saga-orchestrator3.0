apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-worker
  labels: { app.kubernetes.io/name: orchestrator-worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator-worker }
    spec:
      containers:
        - name: app
          image: saga3
          command: [orchestrator-worker]
          ports: []
          env:
            - { name: SERVICE_NAME, value: orchestrator-worker }
            - { name: CONSUMER_GROUP, value: orchestrator }
            - { name: CONSUMER_TOPICS, value: orchestrator.replies }
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: saga-db, key: ORCHESTRATOR_DSN } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
