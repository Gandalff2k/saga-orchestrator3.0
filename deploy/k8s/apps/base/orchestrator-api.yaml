apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-api
  labels: { app.kubernetes.io/name: orchestrator-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: orchestrator-api }
    spec:
      containers:
        - name: app
          image: saga3
          command: [orchestrator-api]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: SERVICE_NAME, value: orchestrator-api }
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: saga-db, key: ORCHESTRATOR_DSN } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-api
spec:
  selector: { app.kubernetes.io/name: orchestrator-api }
  ports:
    - { name: http, port: 80, targetPort: http }
---
# The API is stateless: scale on CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orchestrator-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: orchestrator-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
