# Node drains / cluster upgrades take down at most one pod per component.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orchestrator-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator-api }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orchestrator-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: orchestrator-worker }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: inventory-worker }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payment-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payment-worker }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay-orchestrator
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: outbox-relay-orchestrator }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay-inventory
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: outbox-relay-inventory }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: outbox-relay-payment
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: outbox-relay-payment }
