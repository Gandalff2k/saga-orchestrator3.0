# Local kind cluster. Image is side-loaded: `kind load docker-image saga3:dev --name saga3`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saga

resources:
  - ../../base

# Local-only credentials. Real environments: External Secrets / Sealed Secrets.
secretGenerator:
  - name: saga-db
    literals:
      - ORCHESTRATOR_DSN=postgres://saga:saga@postgres:5432/orchestrator?sslmode=disable
      - INVENTORY_DSN=postgres://saga:saga@postgres:5432/inventory?sslmode=disable
      - PAYMENT_DSN=postgres://saga:saga@postgres:5432/payment?sslmode=disable

patches:
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
