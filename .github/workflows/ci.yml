name: ci

on:
  push: { branches: [main] }
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./... && go vet -tags=integration ./test/...
      - run: go test -race -count=1 -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v8
        with: { version: latest }

  integration:
    runs-on: ubuntu-latest # has Docker -> testcontainers works
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -tags=integration -count=1 -timeout=10m ./test/integration/...

  image:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=${{ github.sha }} -t saga3:ci .
      - run: docker compose config -q
      - name: render k8s manifests
        run: kubectl kustomize deploy/k8s/infra >/dev/null && kubectl kustomize deploy/k8s/apps/overlays/kind >/dev/null
