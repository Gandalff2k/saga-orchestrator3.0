apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: inventory-worker
spec:
  scaleTargetRef: { name: inventory-worker }
  minReplicaCount: 2
  maxReplicaCount: 12
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown: { stabilizationWindowSeconds: 120 }
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: saga-kafka-kafka-bootstrap.saga.svc:9092
        consumerGroup: inventory
        topic: inventory.commands
        lagThreshold: "200" # target lag per replica
        offsetResetPolicy: earliest
---
