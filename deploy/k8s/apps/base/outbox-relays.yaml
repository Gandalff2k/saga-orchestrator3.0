# One relay Deployment per service DB. Replicas split the 16 outbox shards via
# leases: 2 = HA, more = throughput, >16 = idle pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay-orchestrator
  labels: { app.kubernetes.io/name: outbox-relay-orchestrator }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: outbox-relay-orchestrator }
  template:
    metadata:
      labels: { app.kubernetes.io/name: outbox-relay-orchestrator }
    spec:
      containers:
        - name: app
          image: saga3
          command: [outbox-relay]
          ports: []
          env:
            - { name: SERVICE_NAME, value: outbox-relay-orchestrator }
            - name: POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: saga-db, key: ORCHESTRATOR_DSN } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
---
