version: "2"

run:
  build-tags: [integration]

linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      # Signatures dictated by interfaces (inbox.Handler, kafka.Processor):
      # an unused ctx is normal there, renaming it to _ is churn.
      - linters: [revive]
        text: "^unused-parameter:"
      # SCAFFOLD: stubs keep their final signatures until implemented.
      # Delete this rule together with internal/platform/todo.
      - linters: [unparam, unused]
        path: internal/(platform/(kafka|outbox|inbox)|inventory|payment)/

formatters:
  enable: [gofmt, goimports]
  settings:
    goimports:
      local-prefixes: [github.com/Gandalff2k/saga3]
